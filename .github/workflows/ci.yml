name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: gofmt / vet / build / generate / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 双库都要跑：缺 PostgreSQL 直接失败，不许静默跳过。
      SATCHEL_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      SATCHEL_TEST_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "以下文件未经 gofmt：" && echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go generate
        run: |
          go generate ./...
          if ! git diff --exit-code; then
            echo "生成物与注册表不一致，请运行 go generate ./internal/base/schema/ 并提交"
            exit 1
          fi

      - name: go test
        run: go test ./...

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck --severity=error install.sh docker-entrypoint.sh
          # 全量输出只作提示，不阻断（spec 的口径是没有 error 级问题）。
          shellcheck install.sh docker-entrypoint.sh || true

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: satchel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image reports version
        run: docker run --rm satchel:ci version | grep -q "satchel 0.0.0-dev"

      - name: default command serves and turns healthy
        run: |
          cid=$(docker run -d --network host satchel:ci)
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$cid")
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker logs "$cid"
          [ "$status" = "healthy" ] || { echo "::error::容器 $(docker inspect --format '{{.State.Status}}' "$cid")，健康状态 $status"; exit 1; }
          curl -fsS http://127.0.0.1:12889/api/v1/healthz | grep -q '"status":"ok"'
          docker stop "$cid" >/dev/null
